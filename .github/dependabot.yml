version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    # yangi versiya kamida 2 hafta "yetilsin" (docs/MAINTAINING.md)
    cooldown:
      default-days: 14
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # yangi versiya kamida 2 hafta "yetilsin" (docs/MAINTAINING.md)
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ["*"]
  # Dockerfile'lardagi image digest'lari (linux/ — lokal sinov muhiti, bot/ — Telegram bot)
  - package-ecosystem: docker
    directories: ["/linux", "/bot"]
    schedule:
      interval: monthly
    # yangi versiya kamida 2 hafta "yetilsin" (docs/MAINTAINING.md)
    cooldown:
      default-days: 14
    groups:
      docker:
        patterns: ["*"]
  # bitg.uz serveri (deploy/docker-compose.yml: caddy, python digest'lari)
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: monthly
    # yangi versiya kamida 2 hafta "yetilsin" (docs/MAINTAINING.md)
    cooldown:
      default-days: 14
    groups:
      docker-compose:
        patterns: ["*"]
  # Python vositalari (xesh bilan qotirilgan): e2e sinovi (PySide6) va demo GIF (pillow)
  - package-ecosystem: pip
    directories: ["/tools/e2e", "/tools/demo"]
    schedule:
      interval: monthly
    # yangi versiya kamida 2 hafta "yetilsin" (docs/MAINTAINING.md)
    cooldown:
      default-days: 14
    groups:
      pip:
        patterns: ["*"]
