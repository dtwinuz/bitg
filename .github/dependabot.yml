version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  # Dockerfile'lardagi image digest'lari (linux/ — lokal sinov muhiti, bot/ — Telegram bot)
  - package-ecosystem: docker
    directories: ["/linux", "/bot"]
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]
