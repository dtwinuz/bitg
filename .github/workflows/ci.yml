name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p bitg-cli
      - name: Smoke
        shell: bash
        run: |
          out=$(./target/release/bitg "O'zbekiston shaharlari: Toshkent")
          test "$out" = "Özbekiston şaharlari: Toşkent"
      - name: Site build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          head -c 4096 /dev/zero > "$RUNNER_TEMP/ci.msi"
          # build.py Linux va macOS paketlarini MSI yonidan qidiradi (nom Cargo.toml versiyasidan)
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          for p in "bitg_${ver}_amd64.deb" "fcitx5-bitg_${ver}_amd64.deb" "bitg-${ver}-macos.pkg"; do head -c 4096 /dev/zero > "$RUNNER_TEMP/$p"; done
          python3 -I tools/site/build.py --out "$RUNNER_TEMP/site" --v ci --msi "$RUNNER_TEMP/ci.msi"
          test -f "$RUNNER_TEMP/site/404.html" && test -f "$RUNNER_TEMP/site/sitemap.xml"
