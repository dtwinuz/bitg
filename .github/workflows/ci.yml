name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p bitg-cli
      - name: Smoke
        shell: bash
        run: |
          out=$(./target/release/bitg "O'zbekiston shaharlari: Toshkent")
          test "$out" = "Özbekiston şaharlari: Toşkent"
      - name: Site build
        if: runner.os == 'Linux'
        shell: bash
        run: |
          head -c 4096 /dev/zero > "$RUNNER_TEMP/ci.msi"
          # build.py Linux va macOS paketlarini MSI yonidan qidiradi (nom Cargo.toml versiyasidan)
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          for p in "bitg_${ver}_amd64.deb" "fcitx5-bitg_${ver}_amd64.deb" "bitg-${ver}-macos.pkg"; do head -c 4096 /dev/zero > "$RUNNER_TEMP/$p"; done
          python3 -I tools/site/build.py --out "$RUNNER_TEMP/site" --v ci --msi "$RUNNER_TEMP/ci.msi"
          test -f "$RUNNER_TEMP/site/404.html" && test -f "$RUNNER_TEMP/site/sitemap.xml"
          test -f "$RUNNER_TEMP/site/yuklab-olish/rahmat/index.html" && test -f "$RUNNER_TEMP/site/fikr/index.html"
          grep -q 'dl.js' "$RUNNER_TEMP/site/index.html" && grep -q 'data-dl="win"' "$RUNNER_TEMP/site/index.html"
      - name: Site tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 -I deploy/stats/stats.py --selftest
          python3 -I -m py_compile tools/apt/apt_repo.py tools/release/packaging.py tools/release/announce.py
          # har reliz e'loni CHANGELOG'dan to'g'ri chiqadimi va Telegram chegarasiga sig'adimi
          for v in $(sed -n 's/^## \[\([0-9][^]]*\)\].*/\1/p' CHANGELOG.md); do python3 -I tools/release/announce.py "$v" --dry-run >/dev/null; done
          sh -n deploy/set-stats-env.sh && bash -n deploy/deploy.sh && bash -n tools/apt/genkey.sh
      - name: Telegram bot
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo fmt --manifest-path bot/Cargo.toml --check
          cargo clippy --manifest-path bot/Cargo.toml --locked --release -- -D warnings
          cargo build --manifest-path bot/Cargo.toml --locked --release
          python3 -I bot/test/e2e.py bot/target/release/bitg-bot
          sh -n bot/set-token.sh && bash -n deploy/deploy-bot.sh
