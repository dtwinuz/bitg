name: macos

# InputMethodKit kiritish usuli: universal bitg.app, .pkg, sinov (soxta matn maydoni) va o'rnatish tekshiruvi.
on:
  push:
    branches: [main, "macos/**"]
    paths: ["crates/bitg-core/**", "crates/bitg-ime/**", "linux/include/**", "macos/**", "Cargo.*", ".github/workflows/macos.yml"]
  pull_request:
    paths: ["crates/bitg-core/**", "crates/bitg-ime/**", "linux/include/**", "macos/**", "Cargo.*", ".github/workflows/macos.yml"]

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  imk:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked -p bitg-ime
      - name: bitg.app va .pkg
        run: macos/build.sh
      - name: Reproducible build
        run: |
          b="$RUNNER_TEMP/second"
          git worktree add --detach "$b" HEAD
          (cd "$b" && macos/build.sh >/dev/null)
          n=$(basename target/macos/bitg-*-macos.pkg)
          a=$(shasum -a 256 < "target/macos/$n" | cut -d' ' -f1); c=$(shasum -a 256 < "$b/target/macos/$n" | cut -d' ' -f1)
          echo "$n  $a  $c"
          { echo '### Reproducible .pkg'; echo '```'; echo "$a  $n"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$a" != "$c" ]; then
            # ikki nusxa: xar TOC, xar ichidagi fayllar (siqilgan Payload ham), ochilgan Payload va stage binarlari
            for d in 1 2; do
              t="$PWD"; [ $d = 2 ] && t="$b"
              x="$RUNNER_TEMP/x$d"; mkdir -p "$x/raw"
              xar --dump-toc="$x/toc.xml" -f "$t/target/macos/$n"
              (cd "$x/raw" && xar -xf "$t/target/macos/$n")
              pkgutil --expand-full "$t/target/macos/$n" "$x/full"
              (cd "$t/target/macos" && find bin stage -type f -exec shasum -a 256 {} + | sort -k2) > "$x/stage.txt"
            done
            echo '--- TOC'; diff "$RUNNER_TEMP/x1/toc.xml" "$RUNNER_TEMP/x2/toc.xml" || true
            for p in raw full; do
              echo "--- $p"
              diff <(cd "$RUNNER_TEMP/x1/$p" && find . -type f -exec shasum -a 256 {} + | sort -k2) \
                   <(cd "$RUNNER_TEMP/x2/$p" && find . -type f -exec shasum -a 256 {} + | sort -k2) || true
            done
            echo '--- stage'; diff "$RUNNER_TEMP/x1/stage.txt" "$RUNNER_TEMP/x2/stage.txt" || true
            for f in raw/Payload raw/Bom raw/PackageInfo raw/Scripts; do
              cmp -l "$RUNNER_TEMP/x1/$f" "$RUNNER_TEMP/x2/$f" 2>/dev/null | head -8 | sed "s|^|$f |" || true
            done
            exit 1
          fi
      - name: Sinov (Session.swift + dvigatel)
        run: target/macos/bitg-test
      - name: O'rnatish
        run: |
          sudo installer -pkg target/macos/bitg-*-macos.pkg -target /
          APP="/Library/Input Methods/bitg.app"
          test -x "$APP/Contents/MacOS/bitg"
          codesign --verify --strict "$APP"
          lipo -archs "$APP/Contents/MacOS/bitg" | grep -q arm64
          lipo -archs "$APP/Contents/MacOS/bitg" | grep -q x86_64
          /usr/libexec/PlistBuddy -c "Print :InputMethodServerControllerClass" "$APP/Contents/Info.plist" | grep -qx BitgController
          # IMK serveri ishga tushib, 3 soniya yiqilmay turishi kerak
          "$APP/Contents/MacOS/bitg" & pid=$!; sleep 3; kill -0 $pid && kill $pid
          "$APP/Contents/MacOS/bitg" --register | grep -qx "bitg: uz.bitg.inputmethod.bitg.latin yoqildi"
          test "$(tiffutil -info "$APP/Contents/Resources/bitg.tiff" | grep -c 'Image Width')" = 2
      - name: Uchidan-uchiga sinov yig'iladi (ishga tushirish faqat haqiqiy Mac'da, qarang macos/test/e2e.swift)
        run: swiftc -O macos/test/e2e.swift -o target/macos/bitg-e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bitg-macos
          path: target/macos/bitg-*-macos.pkg*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bitg-macos-test
          path: target/macos/bitg-test
          if-no-files-found: error

  # Universal .pkg ning x86_64 bo'lagi Intel Mac'da: sinov va o'rnatish
  intel:
    needs: imk
    runs-on: macos-15-intel
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bitg-macos
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bitg-macos-test
      - name: Sinov (x86_64)
        run: |
          test "$(uname -m)" = x86_64
          chmod +x bitg-test
          ./bitg-test
      - name: O'rnatish
        run: |
          sudo installer -pkg bitg-*-macos.pkg -target /
          APP="/Library/Input Methods/bitg.app"
          "$APP/Contents/MacOS/bitg" & pid=$!; sleep 3; kill -0 $pid && kill $pid
          "$APP/Contents/MacOS/bitg" --register | grep -qx "bitg: uz.bitg.inputmethod.bitg.latin yoqildi"
