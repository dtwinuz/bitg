name: raycast

on:
  push:
    branches: [main]
    paths: ["integrations/raycast/**", "crates/bitg-core/**", "Cargo.toml", "Cargo.lock", ".github/workflows/raycast.yml"]
  pull_request:
    paths: ["integrations/raycast/**", "crates/bitg-core/**", "Cargo.toml", "Cargo.lock", ".github/workflows/raycast.yml"]

concurrency:
  group: raycast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: integrations/raycast
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: extension-wasm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Core (wasm)
        working-directory: .
        run: |
          cargo build -p bitg-core --release --target wasm32-unknown-unknown --target-dir target/site
          cp target/site/wasm32-unknown-unknown/release/bitg_core.wasm integrations/raycast/assets/
          sha256sum integrations/raycast/assets/bitg_core.wasm

      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx prettier --check "src/**/*.{ts,tsx}" "test/**/*.ts"
      - run: npm run build
