name: release

# Faqat versiya tegi (v0.3.0) qo'yilganda: Linux .deb (IBus + Fcitx5), macOS .pkg va MSI quriladi, (sertifikat bo'lsa) MSI
# imzolanadi va hammasi bitta GitHub Release'ga yuklanadi. Har fayl uchun SLSA build provenance va SBOM attestation'i
# yoziladi: `gh attestation verify <fayl> -R dtwinuz/bitg` u shu repodagi shu teg'dan, GitHub Actions'da yig'ilganini tasdiqlaydi.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  deb:
    # Linux paketlari: yig'ish + haqiqiy ibus-daemon bilan sinov; release'ga MSI bilan birga qo'shiladi
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Paketlar
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libibus-1.0-dev ibus dbus python3-gi gir1.2-ibus-1.0 dpkg-dev \
            libfcitx5core-dev libfcitx5utils-dev fcitx5-modules-dev pkg-config
      - name: Versiya tegdan va Cargo.toml'dan bir xilmi
        run: |
          tag="${GITHUB_REF_NAME#v}"; cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$tag" = "$cargo" ] || { echo "Teg $tag, Cargo.toml $cargo"; exit 1; }
      - run: linux/build-deb.sh
      - name: Uchidan-uchiga (ibus-daemon)
        env:
          GSETTINGS_BACKEND: memory
        run: |
          sudo apt-get install -y -q ./target/deb/bitg_*.deb
          dbus-run-session -- python3 -u linux/test/ibus_e2e.py
      - name: SBOM nomi
        run: echo "SBOM=target/deb/bitg-${GITHUB_REF_NAME#v}.spdx.json" >> "$GITHUB_ENV"
      # Cargo.lock va boshqa manifestlardan: bitg qaysi kutubxonalarning qaysi versiyasidan yig'ilgani (SPDX)
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: ${{ env.SBOM }}
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: |
            target/deb/*.deb
            target/deb/*.deb.sha256
            target/deb/*.spdx.json
          if-no-files-found: error

  pkg:
    # macOS o'rnatuvchisi (universal): yig'ish + sinov; release'ga MSI bilan birga qo'shiladi
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Versiya tegdan va Cargo.toml'dan bir xilmi
        run: |
          tag="${GITHUB_REF_NAME#v}"; cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "$tag" = "$cargo" ] || { echo "Teg $tag, Cargo.toml $cargo"; exit 1; }
      - run: macos/build.sh
      - run: target/macos/bitg-test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg
          path: target/macos/bitg-*-macos.pkg*
          if-no-files-found: error

  msi:
    needs: [deb, pkg]
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Versiya tegdan va Cargo.toml'dan bir xilmi
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne $cargo) { throw "Teg $tag, Cargo.toml $cargo" }
          "VERSION=$tag" >> $env:GITHUB_ENV
      - run: cargo test --workspace --locked
      - name: MSI
        shell: pwsh
        env:
          BITG_SIGN_PFX: ${{ secrets.BITG_SIGN_PFX }}
          BITG_SIGN_PFX_PASSWORD: ${{ secrets.BITG_SIGN_PFX_PASSWORD }}
        run: ./installer/build.ps1 -Version $env:VERSION
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb
          path: dist/deb
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pkg
          path: dist/pkg
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-path: |
            dist/bitg-${{ env.VERSION }}-x64.msi
            dist/deb/*.deb
            dist/pkg/*.pkg
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        id: sbom
        with:
          subject-path: |
            dist/bitg-${{ env.VERSION }}-x64.msi
            dist/deb/*.deb
            dist/pkg/*.pkg
          sbom-path: dist/deb/bitg-${{ env.VERSION }}.spdx.json
      # Attestation bundle'lari relizga ham qo'yiladi: internetsiz tekshirish (`gh attestation verify --bundle`)
      # va OpenSSF Scorecard (Signed-Releases: *.intoto.jsonl, *.sigstore.json) uchun.
      - name: Attestation fayllari
        shell: pwsh
        run: |
          Copy-Item "${{ steps.provenance.outputs.bundle-path }}" "dist/bitg-$env:VERSION.intoto.jsonl"
          Copy-Item "${{ steps.sbom.outputs.bundle-path }}" "dist/bitg-$env:VERSION.sbom.sigstore.json"
      - name: Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $deb = Get-ChildItem dist/deb -File | ForEach-Object { $_.FullName }
          if ($deb.Count -lt 5) { throw "deb artefaktlari (2 deb + 2 sha256 + SBOM) to'liq emas: $($deb.Count)" }
          $pkg = Get-ChildItem dist/pkg -File | ForEach-Object { $_.FullName }
          if ($pkg.Count -lt 2) { throw "pkg artefaktlari to'liq emas: $($pkg.Count)" }
          gh release create "${{ github.ref_name }}" dist/bitg-$env:VERSION-x64.msi dist/bitg-$env:VERSION-x64.msi.sha256 @deb @pkg `
            "dist/bitg-$env:VERSION.intoto.jsonl" "dist/bitg-$env:VERSION.sbom.sigstore.json" `
            --title "bitg $env:VERSION" --generate-notes --verify-tag

  announce:
    needs: msi
    permissions:
      contents: read
    uses: ./.github/workflows/announce.yml
    with:
      version: ${{ github.ref_name }}
    secrets:
      BITG_DEVBOT_TOKEN: ${{ secrets.BITG_DEVBOT_TOKEN }}
