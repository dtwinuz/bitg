name: release

# Versiya tegi (v0.3.2) qo'yilganda: build.yml Linux .deb (IBus + Fcitx5), macOS .pkg va MSI ni yig'adi va ularga SLSA
# build provenance + SBOM attestation'ini yozadi (SLSA Build L3, imzolovchi = build.yml). Reliz faqat attestation'ni
# shu teg uchun build.yml imzolagani tekshirilgandan keyin yaratiladi.
#
# Qo'lda (Actions -> release -> Run workflow) = sinov: hammasi yig'iladi, attestation yoziladi va tekshiriladi, lekin
# reliz yaratilmaydi va e'lon yuborilmaydi. Reliz zanjiridagi o'zgarishni teg qo'ymasdan sinash uchun.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Cargo.toml dagi versiya (masalan 0.3.1); reliz yaratilmaydi"
        type: string
        required: true

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = push ]; then v="${GITHUB_REF_NAME#v}"; else v="${INPUT#v}"; fi
          echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "versiya noto'g'ri: $v"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.meta.outputs.version }}
    secrets:
      BITG_SIGN_PFX: ${{ secrets.BITG_SIGN_PFX }}
      BITG_SIGN_PFX_PASSWORD: ${{ secrets.BITG_SIGN_PFX_PASSWORD }}

  verify:
    # Foydalanuvchi va bitg.uz deploy'i bajaradigan tekshiruvning o'zi: imzolovchi build.yml, manba shu ref,
    # GitHub runner. Bittasi o'tmasa reliz yaratilmaydi.
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: gh attestation verify (onlayn, bundle bilan, SBOM)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          cd dist
          ls -l
          signer="$REPO/.github/workflows/build.yml"
          for f in ./*.msi ./*.deb ./*.pkg; do
            gh attestation verify "$f" -R "$REPO" --signer-workflow "$signer" --source-ref "$REF" --deny-self-hosted-runners
            gh attestation verify "$f" -R "$REPO" --signer-workflow "$signer" --source-ref "$REF" --deny-self-hosted-runners \
              --bundle ./*.intoto.jsonl
            gh attestation verify "$f" -R "$REPO" --signer-workflow "$signer" --source-ref "$REF" --deny-self-hosted-runners \
              --predicate-type https://spdx.dev/Document/v2.3
          done

  advisories:
    # SCA relizdan oldin (SECURITY.md): teg vaqtidagi RustSec bazasi bilan qayta tekshiriladi; zaif, qarovsiz
    # yoki ruxsatsiz bog'liqlik bo'lsa reliz yaratilmaydi (istisnolar faqat deny.toml + VEX.openvex.json orqali).
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --color never check advisories licenses sources

  publish:
    if: github.event_name == 'push'
    needs: [verify, advisories]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          n=$(ls | wc -l)
          # MSI + sha256, 2 deb + 2 sha256, pkg + sha256, SBOM, provenance va SBOM bundle'lari
          [ "$n" -eq 11 ] || { ls -l; echo "reliz fayllari 11 ta bo'lishi kerak, bor: $n"; exit 1; }
          gh release create "$TAG" ./* -R "$REPO" --title "bitg ${TAG#v}" --generate-notes --verify-tag

  crates-io:
    # bitg-core crates.io'ga Trusted Publishing (OIDC) bilan chiqadi: repoda token saqlanmaydi.
    # crates.io sozlamasi: dtwinuz/bitg, release.yml, environment crates-io (faqat v* teglar).
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - run: cargo publish -p bitg-core --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  announce:
    if: github.event_name == 'push'
    needs: publish
    permissions:
      contents: read
    uses: ./.github/workflows/announce.yml
    with:
      version: ${{ github.ref_name }}
    secrets:
      BITG_DEVBOT_TOKEN: ${{ secrets.BITG_DEVBOT_TOKEN }}
