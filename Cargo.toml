[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dtwinuz/bitg"
homepage = "https://bitg.uz"
authors = ["dtwinuz"]

[profile.release]
lto = true
codegen-units = 1
# "unwind": IME DLL boshqa dasturlar ichida ishlaydi — panic ushlanadi (catch_unwind), dastur yopilmaydi.
panic = "unwind"
strip = true
opt-level = 3
