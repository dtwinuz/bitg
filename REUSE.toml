version = 1
SPDX-PackageName = "bitg"
SPDX-PackageSupplier = "dtwinuz <https://github.com/dtwinuz>"
SPDX-PackageDownloadLocation = "https://github.com/dtwinuz/bitg"

# Izoh qo'yib bo'lmaydigan fayllar (hujjat, ma'lumot, rasm, generatsiya qilingan manifest) — loyiha litsenziyasi.
# Kod fayllarining har birida o'z SPDX sarlavhasi bor (`reuse lint` CI'da tekshiradi).
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 dtwinuz and bitg contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Inter shrifti (rsms/inter)
[[annotations]]
path = ["web/fonts/*.woff2", "web/fonts/OFL.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2016 The Inter Project Authors <https://github.com/rsms/inter>"
SPDX-License-Identifier = "OFL-1.1"

# SCOWL 2020.12.07 dan olingan inglizcha so'zlar va xorijiy nomlar (tools/build_lexicon.py, tools/build_foreign_names.py)
[[annotations]]
path = ["crates/bitg-core/src/data/en.tsv", "crates/bitg-core/src/data/foreign_names.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2000-2018 Kevin Atkinson and the SCOWL contributors <http://wordlist.aspell.net/>"
SPDX-License-Identifier = "LicenseRef-SCOWL"

# O'zbekcha so'z chastotalari: Leipzig Corpora Collection (CC BY 4.0) gaplaridan hisoblangan; Mozilla Common Voice
# (CC0) va Tatoeba gaplari ham qo'shilgan. Faylda matn yo'q, faqat so'z va og'irlik. Manbalar: README "Lug'at" bo'limi.
[[annotations]]
path = ["crates/bitg-core/src/data/uz.tsv", "crates/bitg-core/src/data/sh_split.tsv"]
precedence = "override"
SPDX-FileCopyrightText = ["Leipzig Corpora Collection, Leipzig University <https://wortschatz.uni-leipzig.de/>", "2026 dtwinuz and bitg contributors"]
SPDX-License-Identifier = "CC-BY-4.0"
