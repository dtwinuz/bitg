# Serverda: /opt/bitg-bot/docker-compose.yml (deploy/deploy-bot.sh nusxalaydi).
# /opt/bitg-bot/.env: BOT_TOKEN=... (repoda yo'q; set-token.sh bilan qo'yiladi), ixtiyoriy SITE_URL=...,
# ADMIN_IDS=778806941[,ID2] — /fikr xabarlari keladigan shaxsiy chatlar (har biri @bitguzbot'ga /start yozgan bo'lsin),
# NEWS_CHANNEL=bitguz. ADMIN_IDS bo'lmasa /fikr GitHub Issues'ga yo'naltiradi.
# Long polling: kiruvchi port va edge kerak emas.
services:
  bitg-bot:
    image: bitg-bot:latest
    container_name: bitg-bot
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      SITE_URL: ${SITE_URL:-https://bitg.uz}
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 64m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
