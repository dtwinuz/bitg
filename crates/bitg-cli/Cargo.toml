[package]
name = "bitg-cli"
description = "bitg command line: convert Uzbek text to the 2026 alphabet, reverse, explain and evaluate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[[bin]]
name = "bitg"
path = "src/main.rs"

[dependencies]
bitg-core = { path = "../bitg-core" }
quick-xml = "0.42"
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
