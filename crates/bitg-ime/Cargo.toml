[package]
name = "bitg-ime"
description = "Platform-neutral typing engine for bitg input methods (IBus, Fcitx5, macOS InputMethodKit): word tracking, replacement, Backspace undo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[lib]
# staticlib: linux/ibus (C), linux/fcitx5 (C++) va macos/ (Swift) dvigatellari shu kutubxonaga statik bog'lanadi
crate-type = ["rlib", "staticlib"]

[dependencies]
bitg-core = { path = "../bitg-core" }
