[package]
name = "bitg-settings"
description = "bitg settings window: switches, exceptions and a live preview (Windows, WebView2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "bitg-settings"
path = "src/main.rs"

[dependencies]
bitg-core = { path = "../bitg-core" }
bitg-tsf = { path = "../bitg-tsf" }
serde_json = "1.0.154"
# yangilanish MSI faylining SHA-256 tekshiruvi (manifestdagi qiymat bilan)
sha2 = "0.10.9"

[target.'cfg(windows)'.dependencies]
wry = "0.57.2"
tao = "0.37.2"
tray-icon = "0.26.1"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0.12"
