# cargo-deny: CI (`ci.yml`, `advisories` job) RustSec bazasida zaiflik, unsound yoki qarovsiz deb belgilangan
# bog'liqlik bo'lsa to'xtaydi. Istisno faqat asoslangan holda, ID bilan va sababi yozilib qo'shiladi.
[advisories]
ignore = [
    # gtk3-macros orqali (wry va tray-icon ning Linux bog'liqligi; bitg-settings faqat Windows'da yetkaziladi).
    # Zaiflik emas, faqat "qarovsiz"; gtk-rs 0.18 tarmog'i almashtirilmaguncha.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error unmaintained, build-time only, via gtk3-macros (Linux deps of wry/tray-icon)" },
]

# Bog'liqliklar litsenziyasi bitg litsenziyasi (MIT OR Apache-2.0) bilan birga tarqatilishi mumkin bo'lsin.
# Ro'yxatda yo'q litsenziya (masalan GPL) paydo bo'lsa CI to'xtaydi: avval moslik tekshiriladi.
[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    # fayl darajasidagi copyleft: o'zgartirilmagan crates.io manbasi, faqat Linux sozlamalar oynasida (wry/selectors)
    "MPL-2.0",
]
confidence-threshold = 0.9

# Bog'liqlik faqat crates.io'dan keladi. Noma'lum registry yoki git manba (begona yoki zararli paket yo'li)
# paydo bo'lsa CI to'xtaydi: qo'shishdan oldin maintainer ko'rib chiqadi va shu yerga asos bilan yozadi.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
