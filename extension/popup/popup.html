<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>bitg</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<main class="p">
  <header class="p-head">
    <a class="p-brand" href="https://bitg.uz" data-link aria-label="bitg.uz">
      <svg class="p-logo" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7.4" fill="#1b1e26"/><path d="M10.748 8.2L10.748 23.8" fill="none" stroke="#f3efe7" stroke-width="2.912" stroke-linecap="round"/><path d="M11.476 18.912a4.888 4.888 0 1 1 9.776 0a4.888 4.888 0 1 1 -9.776 0z" fill="none" stroke="#f3efe7" stroke-width="2.912"/><circle cx="15.116" cy="9.552" r="1.664" fill="#8fb0ea"/><circle cx="19.276" cy="9.552" r="1.664" fill="#8fb0ea"/></svg>
      <span class="p-name">bitg</span>
      <span class="p-tag" data-i18n="tagline"></span>
    </a>
    <div class="p-seg" role="group" data-i18n-label="langLabel" id="lang">
      <button type="button" class="p-seg__b" data-lang="uz" lang="uz">UZ</button>
      <button type="button" class="p-seg__b" data-lang="ru" lang="ru">RU</button>
      <button type="button" class="p-seg__b" data-lang="en" lang="en">EN</button>
    </div>
  </header>

  <section class="p-card" aria-labelledby="in-label">
    <label class="p-label" id="in-label" for="in" data-i18n="inLabel"></label>
    <textarea id="in" class="p-in" rows="4" spellcheck="false" autocomplete="off" data-i18n-ph="inPlaceholder"></textarea>
    <div class="p-label p-label--out"><span data-i18n="outLabel"></span><span class="p-stat" id="stat" aria-live="polite"></span></div>
    <div id="out" class="p-out is-empty" role="region" aria-live="polite" tabindex="0" data-i18n-label="outLabel"></div>
    <div class="p-actions">
      <button type="button" class="p-btn p-btn--ghost" id="clear" data-i18n="clear"></button>
      <button type="button" class="p-btn p-btn--primary" id="copy" disabled>
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="5" y="5" width="8.5" height="8.5" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 3.2V3a1.5 1.5 0 0 0-1.5-1.5H3.5A1.5 1.5 0 0 0 2 3v5.5A1.5 1.5 0 0 0 3.5 10h.3" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        <span data-i18n="copy"></span>
      </button>
    </div>
  </section>

  <section class="p-site" id="site" aria-labelledby="site-label" hidden>
    <h2 class="p-h" id="site-label"><span data-i18n="pageSection"></span> <span class="p-host" id="host"></span></h2>
    <p class="p-note p-note--warn" id="restricted" data-i18n="restricted" hidden></p>
    <div id="site-tools">
      <button type="button" class="p-btn p-btn--wide" id="page" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4h11M2.5 8h7M2.5 12h9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="12.6" cy="8" r="1.4" fill="currentColor"/></svg>
        <span id="page-label" data-i18n="pageOn"></span>
      </button>
      <p class="p-note" data-i18n="pageHint"></p>
      <div class="p-row">
        <label class="p-switch">
          <input type="checkbox" id="auto" role="switch">
          <span class="p-switch__track" aria-hidden="true"></span>
          <span class="p-switch__text" data-i18n="autotype"></span>
        </label>
      </div>
      <p class="p-note" id="auto-hint" data-i18n="autotypeHint"></p>
      <p class="p-note" id="auto-ask" data-i18n="autotypeAsk"></p>
      <p class="p-note p-note--warn" id="docs" data-i18n="autotypeDocs" hidden></p>
    </div>
  </section>

  <footer class="p-foot">
    <p class="p-key"><span id="shortcut"></span> <button type="button" class="p-link" id="shortcut-edit" data-i18n="shortcutEdit" hidden></button></p>
    <p class="p-priv"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.6l5 2v4c0 3.1-2.1 5.6-5 6.8-2.9-1.2-5-3.7-5-6.8v-4z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M5.6 8.1l1.7 1.7 3.2-3.3" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-i18n="privacy"></span></p>
  </footer>
</main>
<script src="../i18n.js"></script>
<script src="../core/core.js"></script>
<script src="../content/lib.js"></script>
<script src="popup.js"></script>
</body>
</html>
